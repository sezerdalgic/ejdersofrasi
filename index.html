<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ejder Sofrası</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        .hud-bar {
            pointer-events: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .bars-wrapper {
            width: 300px;
            max-width: 45vw;
        }
        .bar-bg {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            margin-bottom: 8px;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.2s;
        }
        #hp-fill {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            width: 100%;
        }
        #ult-fill {
            background: linear-gradient(90deg, #8e44ad, #9b59b6);
            width: 0%;
        }
        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            font-size: 12px;
            line-height: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
        #char-select-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }
        .char-card {
            display: inline-block;
            width: 130px;
            height: 200px;
            margin: 10px;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
            padding: 10px;
            vertical-align: top;
        }
        .char-card:hover {
            transform: scale(1.05);
            border-color: #f1c40f;
            background: #333;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 4px solid #d35400;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
            width: 90%;
            max-width: 400px;
            pointer-events: auto;
            z-index: 20;
        }
        input {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            text-align: center;
        }
        button {
            background: #d35400;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .story-btn {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        #bmc-link {
            margin-top: 10px;
            font-size: 13px;
            color: #f5f5f5;
            text-decoration: none;
            display: inline-block;
        }

        /* Mobil kontroller: sadece mobil/tablet */
        .hide-on-desktop {
            display: none;
        }
        @media (hover: none) and (pointer: coarse) {
            .hide-on-desktop {
                display: block;
            }
        }
        #controls-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
        }
        #joystick-area {
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        .joystick-base {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .joystick-thumb {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 60px;
            height: 60px;
            margin-left: -30px;
            margin-top: -30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.7);
            transition: transform 0.05s;
        }
        #btn-attack, #btn-ult {
            position: absolute;
            pointer-events: auto;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(211, 84, 0, 0.9);
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            text-shadow: 0 0 4px #000;
            user-select: none;
        }
        #btn-attack {
            right: 18px;
            bottom: 20px;
        }
        #btn-ult {
            right: 18px;
            bottom: 100px;
            background: rgba(142, 68, 173, 0.9);
        }
    </style>
</head>
<body>

<div id="ui-container">
    <div class="hud-bar" id="hud" style="display: none;">
        <div class="bars-wrapper">
            <div class="bar-bg">
                <div id="hp-fill" class="bar-fill"></div>
                <div class="bar-text">CAN</div>
            </div>
            <div class="bar-bg">
                <div id="ult-fill" class="bar-fill"></div>
                <div class="bar-text">ULTIMATE (SHIFT / ★)</div>
            </div>
        </div>
        <div style="color:white; font-weight:bold; font-size:18px; text-shadow: 2px 2px 0 #000; text-align:right;">
            <div id="score-display">SKOR: 0</div>
            <div id="time-display" style="color: #f1c40f;">SÜRE: 0s</div>
        </div>
    </div>
    
    <div id="char-select-screen">
        <h2 style="color: white; margin-bottom: 20px;">KAHRAMANINI SEÇ</h2>
        <div id="char-container"></div>
    </div>

    <div id="game-over-screen">
        <h1 style="color: #e74c3c; margin: 0;">OYUN BİTTİ</h1>
        <p id="final-score-text">Skor: 0</p>
        <input type="text" id="player-name" placeholder="Adını Gir..." maxlength="10">
        <button class="story-btn" onclick="shareStory()">📸 Story Paylaş</button>
        <button onclick="saveAndRestart()">💾 Tekrar Oyna</button>
        <a id="bmc-link" href="https://buymeacoffee.com/sezerdalgic" target="_blank" rel="noopener">
            ☕ Oyunu geliştirmem için destek olmak istersen tıkla
        </a>
        <div id="leaderboard" style="margin-top:10px; text-align:left; max-height:100px; overflow-y:auto; font-size:14px;"></div>
    </div>
</div>

<!-- Mobil Kontroller -->
<div id="controls-container" class="hide-on-desktop">
    <div id="joystick-area">
        <div class="joystick-base"></div>
        <div class="joystick-thumb" id="joystick-thumb"></div>
    </div>
    <div id="btn-attack">⚔</div>
    <div id="btn-ult">★</div>
</div>

<script>
/* ===================== KARAKTER & DÜŞMAN VERİLERİ ===================== */
const CHARACTERS = {
    rogue:     { name: "Gölge Bıçak",   hp: 80,  speed: 220, dmg: 20, ultReq: 15, color: 0x8e44ad, desc: "Hızlı, Ölümcül.\nUlti: Bıçak Dansı" },
    barbarian: { name: "Baltalı İlah",  hp: 150, speed: 160, dmg: 40, ultReq: 18, color: 0xc0392b, desc: "Tank, Güçlü.\nUlti: İnek Dalgası" },
    druid:     { name: "Doğa Ana",      hp: 100, speed: 190, dmg: 15, ultReq: 16, color: 0x27ae60, desc: "Dengeli.\nUlti: Kurt Sürüsü" },
    paladin:   { name: "Kutsal Şövalye",hp: 130, speed: 180, dmg: 25, ultReq: 20, color: 0xf1c40f, desc: "Dayanıklı.\nUlti: Kutsal Işın" }
};

const ENEMY_TYPES = {
    sailor:  { id: "sailor",  name: "Sailor",  baseHp: 30,  xp: 5,  tint: 0xffffff, speed: 150, isRanged: false },
    jack:    { id: "jack",    name: "Jack",    baseHp: 60,  xp: 12, tint: 0xffdd88, speed: 110, isRanged: true  },
    captain: { id: "captain", name: "Captain", baseHp: 120, xp: 25, tint: 0xff7777, speed: 70,  isRanged: false }
};

let game, selectedCharKey = null;
let score = 0, gameTime = 0;
let level = 1;
let xp = 0;
let xpToNext = 60;

const joystickState = { active:false, dx:0, dy:0 };
let attackPressedTouch = false;
let ultPressedTouch = false;

/* ===================== ENEMY TİP SEÇİMİ ===================== */
function getEnemyTypeForLevel() {
    let wSailor = 70;
    let wJack = 25;
    let wCaptain = 5;

    if (level >= 3 && level < 5) {
        wSailor = 55; wJack = 30; wCaptain = 15;
    } else if (level >= 5) {
        wSailor = 40; wJack = 35; wCaptain = 25;
    }

    const total = wSailor + wJack + wCaptain;
    const r = Math.random() * total;
    if (r < wSailor) return ENEMY_TYPES.sailor;
    if (r < wSailor + wJack) return ENEMY_TYPES.jack;
    return ENEMY_TYPES.captain;
}

/* ===================== PRELOAD SCENE ===================== */
class PreloadScene extends Phaser.Scene {
    constructor() { super({ key: 'PreloadScene' }); }

    preload() {
        this.load.spritesheet("rogue_side", "rogue_side.png", { frameWidth:64, frameHeight:128 });
        this.load.spritesheet("rogue_up",   "rogue_up.png",   { frameWidth:64, frameHeight:128 });
        this.load.spritesheet("rogue_down", "rogue_down.png", { frameWidth:64, frameHeight:128 });

        ["barbarian","druid","paladin","pirate"].forEach(k=>{
            this.load.spritesheet(k, `${k}.png`, { frameWidth:64, frameHeight:64 });
        });

        this.load.image("potion","potion.png");
        this.load.image("logo","logo.png");
    }

    create() {
        // ground
        const g = this.make.graphics({x:0,y:0,add:false});
        g.fillStyle(0x444444).fillRect(0,0,256,256);
        g.generateTexture("ground",256,256); g.clear();

        // rogue anim
        const rows = { idle:0, run:1, basic:2, ult:3, hit:4, death:5 };
        const dirs = ["side","up","down"];
        dirs.forEach(dir=>{
            const key = `rogue_${dir}`;
            Object.keys(rows).forEach(type=>{
                this.anims.create({
                    key:`rogue_${dir}_${type}`,
                    frames:this.anims.generateFrameNumbers(key,{start:rows[type]*12,end:rows[type]*12+7}),
                    frameRate: type==="run"?12:10,
                    repeat: (type==="idle"||type==="run")? -1 : 0
                });
            });
        });

        // pirate walk
        this.anims.create({
            key:"pirate_walk",
            frames:this.anims.generateFrameNumbers("pirate",{start:0,end:3}),
            frameRate:6, repeat:-1
        });

        // enemy bullet texture
        g.fillStyle(0xffe066,1);
        g.fillCircle(4,4,4);
        g.generateTexture("enemyBullet",8,8);
        g.clear();

        // enemy death puff
        g.fillStyle(0xffaa33,0.9);
        g.fillCircle(12,12,12);
        g.generateTexture("enemyDeath",24,24);
        g.destroy();

        this.scene.start("MainScene");
    }
}

/* ===================== MAIN SCENE ===================== */
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key:'MainScene' });
        this.currentDir = "side";
        this.isMoving = false;
        this.facingX = 1;
        this.invulnUntil = 0;
    }

    create() {
        if (!selectedCharKey) return;

        this.add.tileSprite(0,0,this.scale.width,this.scale.height,"ground")
            .setOrigin(0).setScrollFactor(0);

        this.physics.world.setBounds(-10000,-10000,20000,20000);

        const data = CHARACTERS[selectedCharKey];
        this.hp = data.hp;
        this.maxHp = data.hp;
        this.ultCharge = 0;
        this.isDead = false;

        if (selectedCharKey==="rogue") {
            this.player = this.physics.add.sprite(0,0,"rogue_side",0);
            this.player.play("rogue_side_idle");
            this.player.setSize(32,64).setOffset(16,64);
        } else {
            this.player = this.physics.add.sprite(0,0,selectedCharKey);
            this.anims.create({
                key:selectedCharKey+"_walk",
                frames:this.anims.generateFrameNumbers(selectedCharKey,{start:0,end:3}),
                frameRate:10, repeat:-1
            });
            this.player.play(selectedCharKey+"_walk");
        }

        this.cameras.main.startFollow(this.player,true,0.1,0.1).setZoom(1.2);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys("W,A,S,D,SPACE,SHIFT");

        this.enemies = this.physics.add.group();
        this.projectiles = this.physics.add.group();
        this.items = this.physics.add.group();
        this.enemyProjectiles = this.physics.add.group();

        this.physics.add.collider(this.player,this.enemies,this.onHitPlayer,null,this);
        this.physics.add.overlap(this.projectiles,this.enemies,this.onHitEnemy,null,this);
        this.physics.add.overlap(this.player,this.items,this.onItem,null,this);
        this.physics.add.overlap(this.enemyProjectiles,this.player,this.onEnemyProjectileHit,null,this);

        this.time.addEvent({
            delay:1000, loop:true,
            callback: ()=>{
                if(!this.isDead){
                    gameTime++;
                    this.updateHUD();
                }
            }
        });

        this.time.addEvent({ delay:900,  loop:true, callback:this.spawnEnemy,  callbackScope:this });
        this.time.addEvent({ delay:2000, loop:true, callback:this.spawnPotion, callbackScope:this });

        this.updateHUD();
    }

    update() {
        if (this.isDead) return;

        const data = CHARACTERS[selectedCharKey];
        let vx = 0, vy = 0;

        if (joystickState.active) {
            vx = joystickState.dx * data.speed;
            vy = joystickState.dy * data.speed;
        } else {
            if (this.cursors.left.isDown || this.keys.A.isDown) vx = -data.speed;
            if (this.cursors.right.isDown|| this.keys.D.isDown) vx = data.speed;
            if (this.cursors.up.isDown   || this.keys.W.isDown) vy = -data.speed;
            if (this.cursors.down.isDown || this.keys.S.isDown) vy = data.speed;
        }
        this.player.setVelocity(vx,vy);

        let newDir = this.currentDir;
        const moving = !(vx===0 && vy===0);
        if (moving) {
            if (Math.abs(vx)>=Math.abs(vy)) {
                newDir="side";
                if (vx<0) this.facingX=-1;
                if (vx>0) this.facingX=1;
            } else newDir = vy<0 ? "up" : "down";
        }
        if (newDir==="side") this.player.setFlipX(this.facingX<0);
        else this.player.setFlipX(false);

        if (selectedCharKey==="rogue") {
            if(newDir!==this.currentDir || moving!==this.isMoving){
                const anim = moving ? `rogue_${newDir}_run` : `rogue_${newDir}_idle`;
                this.player.play(anim,true);
            }
        }
        this.currentDir=newDir;
        this.isMoving=moving;

        const attackKey  = Phaser.Input.Keyboard.JustDown(this.keys.SPACE);
        const ultKey     = Phaser.Input.Keyboard.JustDown(this.keys.SHIFT);

        if (attackKey || attackPressedTouch) {
            this.basicAttack();
            attackPressedTouch = false;
        }

        if ((ultKey || ultPressedTouch) &&
            this.ultCharge>=CHARACTERS[selectedCharKey].ultReq) {
            this.ultimate();
            ultPressedTouch = false;
        }

        this.updateEnemiesAI();
        this.updateEnemyBullets();
    }

    /* ===================== PLAYER SALDIRILARI ===================== */
    basicAttack() {
        const data = CHARACTERS[selectedCharKey];

        if (selectedCharKey==="rogue") {
            const key = `rogue_${this.currentDir}_basic`;
            this.player.play(key,true);
        }

        const hit = this.projectiles.create(this.player.x,this.player.y,null);
        hit.setVisible(false);
        hit.body.setSize(80,80);
        hit.damage=data.dmg;
        this.time.delayedCall(120,()=>hit.destroy());
    }

    ultimate() {
        const data = CHARACTERS[selectedCharKey];
        this.ultCharge=0;

        if(selectedCharKey==="rogue"){
            this.player.play(`rogue_${this.currentDir}_ult`);

            const circle=this.add.circle(this.player.x,this.player.y,120,0x9b59b6,0.4);
            circle.setDepth(this.player.depth-1);

            this.enemies.getChildren().forEach(e=>{
                if(e.state==="dead") return;
                if(Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y)<=120){
                    e.hp-=data.dmg*3;
                    if(e.hp<=0){
                        this.handleEnemyDeath(e);
                    } else {
                        this.flashEnemy(e);
                    }
                }
            });

            this.tweens.add({
                targets:circle,alpha:0,scale:1.4,duration:400,
                onComplete:()=>circle.destroy()
            });
        }
    }

    /* ===================== ENEMY SPAWN ===================== */
    spawnEnemy() {
        if(this.isDead) return;
        const angle=Math.random()*Math.PI*2;
        const dist=600;
        const x=this.player.x+Math.cos(angle)*dist;
        const y=this.player.y+Math.sin(angle)*dist;

        const type = getEnemyTypeForLevel();
        const e=this.enemies.create(x,y,"pirate");
        e.typeKey = type.id;
        e.config  = type;
        e.hp      = type.baseHp + (level-1)*8;
        e.maxHp   = e.hp;
        e.xpOnKill= type.xp;
        e.speed   = type.speed;
        e.isRanged= type.isRanged;
        e.state   = "walk";
        e.nextAttackTime = 0;
        e.attackWindupUntil = 0;
        e.reloadUntil = 0;
        e.setTint(type.tint);
        e.play("pirate_walk");
    }

    spawnPotion() {
        const x=this.player.x+Phaser.Math.Between(-400,400);
        const y=this.player.y+Phaser.Math.Between(-300,300);
        const p=this.items.create(x,y,"potion").setScale(0.8);
        p.type="potion";
    }

    /* ===================== ENEMY AI & BULLETS ===================== */
    updateEnemiesAI() {
        const now = this.time.now;
        const player = this.player;

        this.enemies.getChildren().forEach(e=>{
            if (!e.active || e.state==="dead") return;

            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            const nx = dx/dist;
            const ny = dy/dist;

            if (e.isRanged) {
                const attackRange = 250;
                if (e.state === "walk") {
                    if (dist > attackRange) {
                        e.body.setVelocity(nx*e.speed, ny*e.speed);
                    } else {
                        e.state = "attack_windup";
                        e.attackWindupUntil = now + 250; // 0.25s
                        e.body.setVelocity(0,0);
                    }
                } else if (e.state === "attack_windup") {
                    e.body.setVelocity(0,0);
                    if (now >= e.attackWindupUntil) {
                        this.fireJackBullet(e);
                        e.state = "reload";
                        e.reloadUntil = now + 2250; // 2.25s
                    }
                } else if (e.state === "reload") {
                    // reload sırasında yavaş yürüsün (biraz konum alsın)
                    const slow = 0.4;
                    if (dist > attackRange + 40) {
                        e.body.setVelocity(nx*e.speed*slow, ny*e.speed*slow);
                    } else {
                        e.body.setVelocity(0,0);
                    }
                    if (now >= e.reloadUntil) {
                        e.state = "walk";
                    }
                }
            } else {
                // Melee (Sailor, Captain) – basit chase
                e.body.setVelocity(nx*e.speed, ny*e.speed);
            }
        });
    }

    fireJackBullet(enemy) {
        const player = this.player;
        const bulletSpeed = 280;

        // Player hızına göre basit predictive aim
        const pvx = player.body ? player.body.velocity.x : 0;
        const pvy = player.body ? player.body.velocity.y : 0;
        const tLead = 0.3;
        let targetX = player.x + pvx * tLead;
        let targetY = player.y + pvy * tLead;

        // Level'e göre hafif iyileşen isabet (miss radius)
        const baseMiss = 80;
        const missRadius = Math.max(50, baseMiss - (level-1)*4); // 80 → min 50
        targetX += Phaser.Math.Between(-missRadius, missRadius);
        targetY += Phaser.Math.Between(-missRadius, missRadius);

        let dx = targetX - enemy.x;
        let dy = targetY - enemy.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        dx /= dist; dy /= dist;

        const b = this.enemyProjectiles.create(enemy.x, enemy.y, "enemyBullet");
        b.startX = enemy.x;
        b.startY = enemy.y;
        b.body.setVelocity(dx*bulletSpeed, dy*bulletSpeed);
    }

    updateEnemyBullets() {
        this.enemyProjectiles.getChildren().forEach(b=>{
            if (!b.active) return;
            const traveled = Phaser.Math.Distance.Between(b.startX, b.startY, b.x, b.y);
            if (traveled >= 200) {
                b.destroy();
            }
        });
    }

    /* ===================== ÇARPIŞMALAR ===================== */
    onHitEnemy(proj, enemy) {
        if (!enemy.active || enemy.state==="dead") {
            proj.destroy();
            return;
        }
        enemy.hp -= proj.damage;
        proj.destroy();

        if (enemy.hp <= 0) {
            this.handleEnemyDeath(enemy);
        } else {
            this.flashEnemy(enemy);
            // hafif geri tepme
            const dx = enemy.x - this.player.x;
            const dy = enemy.y - this.player.y;
            const dist = Math.sqrt(dx*dx+dy*dy) || 1;
            const kb = 60;
            enemy.body.velocity.x += (dx/dist)*kb;
            enemy.body.velocity.y += (dy/dist)*kb;
        }
        this.updateHUD();
    }

    onEnemyProjectileHit(bullet, player) {
        bullet.destroy();
        this.applyPlayerDamage(bullet.x, bullet.y);
    }

    onHitPlayer(player, enemy) {
        this.applyPlayerDamage(enemy.x, enemy.y);
    }

    applyPlayerDamage(sourceX, sourceY) {
        if (this.isDead) return;
        const now = this.time.now;
        if (now < this.invulnUntil) return; // i-frame

        this.invulnUntil = now + 300; // 0.3s
        this.hp -= 5;

        // knockback
        let dx = this.player.x - sourceX;
        let dy = this.player.y - sourceY;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        dx /= dist; dy /= dist;
        const kb = 140;
        this.player.setVelocity(dx*kb, dy*kb);

        // flash
        this.tweens.add({
            targets:this.player,
            alpha:0.4,
            duration:80,
            yoyo:true,
            repeat:1
        });

        // küçük kamera shake
        this.cameras.main.shake(100,0.005);

        if (this.hp <= 0) {
            this.gameOver();
        }
        this.updateHUD();
    }

    flashEnemy(e) {
        const originalTint = e.config ? e.config.tint : 0xffffff;
        e.setTint(0xffffff);
        this.time.delayedCall(80, ()=> {
            if (e.active) e.setTint(originalTint);
        });
    }

    handleEnemyDeath(enemy) {
        if (!enemy.active || enemy.state==="dead") return;

        enemy.state = "dead";
        enemy.body.setVelocity(0,0);
        enemy.body.enable = false;

        score += 10;
        this.ultCharge++;
        const gainedXp = enemy.xpOnKill || 0;
        xp += gainedXp;
        if (xp >= xpToNext) {
            this.levelUp();
        }

        // death efekti
        const puff = this.add.sprite(enemy.x, enemy.y, "enemyDeath").setScale(0.8).setAlpha(0.9);
        this.tweens.add({
            targets:puff,
            scale:1.4,
            alpha:0,
            duration:220,
            onComplete:()=>puff.destroy()
        });

        this.tweens.add({
            targets:enemy,
            scale:0,
            alpha:0,
            duration:160,
            onComplete:()=>enemy.destroy()
        });
    }

    /* ===================== LEVEL UP ===================== */
    levelUp() {
        level++;
        xp -= xpToNext;
        xpToNext = Math.floor(xpToNext * 1.4);
        this.showLevelUpText();
    }

    showLevelUpText() {
        const txt = this.add.text(this.player.x, this.player.y - 80, "LVL UP", {
            fontFamily: "Segoe UI",
            fontSize: "20px",
            color: "#ffff66",
            stroke: "#000000",
            strokeThickness: 3
        }).setOrigin(0.5);

        this.tweens.add({
            targets: txt,
            y: txt.y - 40,
            alpha: 0,
            duration: 600,
            ease: "Cubic.easeOut",
            onComplete: () => txt.destroy()
        });
    }

    /* ===================== ITEM, HUD, GAME OVER ===================== */
    onItem(player,item){
        if(item.type==="potion"){
            this.hp=Math.min(this.maxHp,this.hp+this.maxHp*0.20);
            item.destroy();
            this.updateHUD();
        }
    }

    updateHUD(){
        document.getElementById("score-display").innerText = `SKOR: ${score}`;
        document.getElementById("time-display").innerText  = `SÜRE: ${gameTime}s`;
        document.getElementById("hp-fill").style.width =
            (this.hp/this.maxHp*100)+"%";
        document.getElementById("ult-fill").style.width =
            (Math.min(100,(this.ultCharge/CHARACTERS[selectedCharKey].ultReq)*100))+"%";
    }

    gameOver(){
        if (this.isDead) return;
        this.isDead=true;

        if (selectedCharKey === "rogue") {
            this.player.play(`rogue_${this.currentDir}_death`, true);
        } else {
            this.player.setTint(0xff0000);
            this.player.setVelocity(0,0);
        }

        this.physics.pause();

        document.getElementById("hud").style.display="none";
        document.getElementById("game-over-screen").style.display="block";
        document.getElementById("final-score-text").innerText = `Toplam Puan: ${score}`;
    }
}

/* ===================== KARAKTER SEÇİMİ ===================== */
function initCharSelect(){
    const container=document.getElementById("char-container");
    Object.keys(CHARACTERS).forEach(key=>{
        const c=CHARACTERS[key];
        const div=document.createElement("div");
        div.className="char-card";
        div.innerHTML=`
            <div style="width:100%;height:80px;background:#${c.color.toString(16)};"></div>
            <span style="color:white;font-weight:bold;">${c.name}</span><br>
            <span style="color:#aaa;font-size:11px;">${c.desc.replace("\n","<br>")}</span>
        `;
        div.onclick=()=>{
            selectedCharKey=key;
            document.getElementById("char-select-screen").style.display="none";
            document.getElementById("hud").style.display="flex";

            game=new Phaser.Game({
                type:Phaser.AUTO,
                width:window.innerWidth,
                height:window.innerHeight,
                physics:{ default:'arcade' },
                scene:[PreloadScene,MainScene],
                transparent:true
            });
        };
        container.appendChild(div);
    });
}

/* ===================== MOBİL KONTROLLER ===================== */
function setupMobileControls() {
    const area = document.getElementById("joystick-area");
    const thumb = document.getElementById("joystick-thumb");
    const btnAttack = document.getElementById("btn-attack");
    const btnUlt = document.getElementById("btn-ult");

    if (!area || !thumb) return;

    const radius = area.clientWidth / 2;

    function updateThumb(dx, dy) {
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), radius);
        const angle = Math.atan2(dy, dx);
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        thumb.style.transform = `translate(${tx}px, ${ty}px)`;
    }

    function handleStart(clientX, clientY) {
        const rect = area.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;

        joystickState.active = true;

        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        dx /= len; dy /= len;
        joystickState.dx = dx;
        joystickState.dy = dy;

        updateThumb(dx*radius, dy*radius);
    }

    function handleMove(clientX, clientY) {
        if (!joystickState.active) return;
        const rect = area.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        dx /= len; dy /= len;
        joystickState.dx = dx;
        joystickState.dy = dy;
        updateThumb(dx*radius, dy*radius);
    }

    function handleEnd() {
        joystickState.active = false;
        joystickState.dx = 0;
        joystickState.dy = 0;
        thumb.style.transform = `translate(0px, 0px)`;
    }

    area.addEventListener("touchstart", (e)=>{
        e.preventDefault();
        const t = e.changedTouches[0];
        handleStart(t.clientX, t.clientY);
    }, {passive:false});

    area.addEventListener("touchmove", (e)=>{
        e.preventDefault();
        const t = e.changedTouches[0];
        handleMove(t.clientX, t.clientY);
    }, {passive:false});

    area.addEventListener("touchend", (e)=>{
        e.preventDefault();
        handleEnd();
    }, {passive:false});

    area.addEventListener("touchcancel", (e)=>{
        e.preventDefault();
        handleEnd();
    }, {passive:false});

    // Desktop test için mouse
    let mouseDown = false;
    area.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        mouseDown = true;
        handleStart(e.clientX, e.clientY);
    });
    window.addEventListener("mousemove", (e)=>{
        if (!mouseDown) return;
        e.preventDefault();
        handleMove(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", (e)=>{
        if (!mouseDown) return;
        e.preventDefault();
        mouseDown = false;
        handleEnd();
    });

    function attachPressFlag(el, flagSetter) {
        if (!el) return;
        el.addEventListener("touchstart", (e)=>{
            e.preventDefault();
            flagSetter(true);
        }, {passive:false});
        el.addEventListener("mousedown", (e)=>{
            e.preventDefault();
            flagSetter(true);
        });
    }

    attachPressFlag(btnAttack, (val)=>{ attackPressedTouch = val; });
    attachPressFlag(btnUlt,    (val)=>{ ultPressedTouch    = val; });
}

window.onload = () => {
    initCharSelect();
    setupMobileControls();
};
</script>
